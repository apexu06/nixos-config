system: "base16"
name: "Tokyo Night Terminal Dark"
author: "Michaël Ball"
variant: "dark"
palette:
  base00: "#1a1b26" # Editor Background (Night)
  base01: "#24283b" # Editor Background (Storm)
  base02: "#414868" # Terminal Black
  base03: "#565f89" # Comments
  base04: "#9aa5ce" # Markdown Text / HTML Text
  base05: "#c0caf5" # Editor Foreground
  base06: "#c0caf5" # Variables, Class names, Terminal White
  base07: "#cfc9c2" # Parameters inside functions
  base08: "#f7768e" # This keyword, Terminal Red
  base09: "#ff9e64" # Number and Boolean constants
  base0A: "#e0af68" # Function parameters, Terminal Yellow
  base0B: "#9ece6a" # Strings, CSS class names
  base0C: "#7dcfff" # Terminal Cyan, Regex quantifiers
  base0D: "#7aa2f7" # Function names, Terminal Blue
  base0E: "#bb9af7" # Control Keywords, Terminal Magenta
  base0F: "#b4f9f8" # Regex literal strings


