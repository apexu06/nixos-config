env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland,x11

monitor = eDP-1,2880x1920@120,0x0,1.5
monitor = DP-3,2560x1440@180,auto,1
monitor = HDMI-A-1,1920x1080@71.91,-1920x0,1
monitor = Virtual-1,2560x1440,auto,1

exec-once = dunst
exec-once = blueman-applet
exec-once = ags run

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store 

input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options = caps:escape
    kb_rules =
    follow_mouse = 1
    repeat_delay = 175

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 
}

general {
    gaps_in = 4
    gaps_out = 12
    border_size = 0
    col.active_border = 0xff7AA2F7
    col.inactive_border = 0xff565F89
    layout = dwindle
    allow_tearing = false

    snap {
        enabled = true
    }
}


dwindle {
    pseudotile = yes 
    preserve_split = yes 
}

master {
}


misc {
    force_default_wallpaper = 0 
    enable_swallow = true
}

decoration {
    rounding = 10
    
    blur {
        enabled = true
        size = 4
        passes = 6
        brightness = 1
        xray = false
        new_optimizations = true
        vibrancy = 0.4
    }

    shadow {
        enabled = false
        range = 40

    }

    dim_inactive = true
    dim_strength = 0.1

    layerrule = blur,waybar
    layerrule = ignorealpha,waybar
    layerrule = blur,quickshell
    layerrule = ignorealpha 0.2,quickshell
    layerrule = blurpopups,quickshell
    layerrule = blur,gtk4-layer-shell
    layerrule = blurpopups,gtk4-layer-shell
    layerrule = ignorealpha 0.2,gtk4-layer-shell

    # windowrule=float,theme
    # windowrule=size 400px 200px,theme
    # windowrulev2 = float, title:^(.*Hyprshot.*)$
}

animations {
    enabled = yes

    animation = windows, 1, 3, default
    animation = windowsOut, 2, 4, default, popin 50%
    animation = border, 1, 4, default
    animation = borderangle, 1, 5, default
    animation = fade, 0
    animation = workspaces, 1, 3, default  
}


$mainMod = SUPER
bind = $mainMod, RETURN, exec, wezterm
bind = $mainMod, BACKSPACE, killactive, 
bind = $mainMod SHIFT, Q, exit, 
bind = $mainMod, P, exec, $drun
bind = $mainMod, N, exec, networkmanager_dmenu
bind = $mainMod, E, exec, wofi-emoji
bind = $mainMod SHIFT, L, exec, $lockscreen
bind = $mainMod SHIFT, M, exec, wlogout
bind = $mainMod, C, exec, hyprpicker -a 
bind = $mainMod, I, exec, ~/.config/hypr/scripts/toggle-animations.sh
bind = $mainMod CONTROL, S, exec, $screenshot
bind = $mainMod SHIFT, H, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy




bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, SPACE, togglesplit, 
bind = $mainMod, V, togglefloating, 
bind = $mainMod, TAB, cyclenext, prev
bind = $mainMod, TAB, bringactivetotop 
bind = $mainMod, J, cyclenext
bind = $mainMod, K, cyclenext, prev


bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic


bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


bind=ALT,R,submap,resize
submap=resize
binde=,right,resizeactive,20 0
binde=,left,resizeactive,-20 0
binde=,up,resizeactive,0 -20
binde=,down,resizeactive,0 20
bind=,escape,submap,reset 
submap=reset

workspace = 1, monitor:DP-3, default:true
workspace = 2, monitor:DP-3
workspace = 3, monitor:DP-3
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1




binde =, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
binde =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind =, XF86AudioPlay, exec, playerctl play-pause
bind =, XF86AudioNext, exec, playerctl next
bind =, XF86AudioPrev, exec, playerctl prev

bindle=, XF86MonBrightnessUp, exec, brightnessctl s +10
bindle=, XF86MonBrightnessDown, exec, brightnessctl s 10-


