    box_width = 432.0
    cx = 1280.0
    cy = 720.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "analog"

[nightlight]
enabled = true

[notification]
background_opacity = 1.0
position = "top_center"

[osd]
background_opacity = 1.0
border = false

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
app_icon_color = "on_surface"
avatar_path = "/home/jzep/Pictures/logo.png"
button_borders = false
card_borders = false
font_family = "Adwaita Sans"
input_borders = false
popup_borders = false
scale = 1.1000000000000001
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = false
ui_scale = 1.2000000104308128

    [shell.panel]
    borders = false
    launcher_categories = false
    launcher_placement = "attached"
    session_placement = "centered"

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"
custom_palette = "stylix"
mode = "light"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper.default]
path = "/home/jzep/Pictures/Wallpapers/wallpaper.jpg"

[wallpaper.last]
path = "/home/jzep/Pictures/Wallpapers/wallpaper.jpg"

[wallpaper.monitors.DP-1]
path = "/nix/store/6g4fgpvvi8qdx3wawf3mb3iqf5r8kxgk-wallpaper.jpg"

[wallpaper.monitors.DP-3]
path = "/home/jzep/Pictures/Wallpapers/wallpaper.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/jzep/Pictures/Wallpapers/wallpaper.jpg"

[widget.brightness]
show_label = false

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.ollama]
glyph = "robot"
type = "custom_button"

    [widget.ollama.actions]
    left = "exec systemctl start ollama && systemctl start open-webui"
    right = "exec systemctl stop ollama && systemctl stop open-webui"

[widget.spacer_2]
length = 10
type = "spacer"

[widget.spacer_3]
length = 10
type = "spacer"

[widget.taskbar]
only_active_workspace = true

[widget.tray]
drawer = true
hidden = [ "udiskie" ]
match_adjacent_spacing = true
pinned = []

[widget.volume]
show_label = false

[widget.workspaces]
hide_when_empty = true
