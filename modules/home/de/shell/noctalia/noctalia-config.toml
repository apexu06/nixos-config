[accessibility]
ui_scale = 1.1000000089406967

[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.0
tint_intensity = 0.59999998658895493

[bar.widgets]
background_opacity = 0.73999998345971107
center = [ "clock", "media", "notifications" ]
end = [ "ollama", "network", "bluetooth", "volume", "battery", "tray", "control-center" ]
font_family = "Adwaita Sans"
margin_edge = 0
margin_ends = 0
padding = 10
radius = 0
scale = 1.1000000000000001
start = [ "workspaces", "taskbar" ]
thickness = 32
widget_spacing = 8

[brightness]
enable_ddcutil = true

[control_center]
width = 750

[desktop_widgets]
schema_version = 1
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1596.0
    cy = 608.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        rotation_speed = 0.40000000000000002
        visualization_mode = "wave_rings"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 160.0
    box_width = 384.0
    cx = 1600.0
    cy = 892.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        color = "on_surface"
        hide_when_no_media = false
        layout = "horizontal"
        shadow = true

[dock]
auto_hide = true
background_opacity = 0.69999999999999996

[hooks]
battery_charging = "noctalia msg power-set performance"
battery_discharging = "noctalia msg power-set balanced"

[idle]
behavior_order = [ "dim-screen", "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.dim-screen]
    action = "command"
    command = "brightnessctl set 10%"
    enabled = true
    resume_command = "brightnessctl -r"
    timeout = 350

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 400

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 450

[keybinds]
down = [ "Ctrl+n" ]
up = [ "Ctrl+p" ]

[location]
auto_locate = true

[lockscreen]
allow_empty_password = true
blur_intensity = 0.39999999105930328

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@winit",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-widget-0000000000000001"
