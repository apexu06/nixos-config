[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.0
tint_intensity = 0.59999998658895493

[bar.widgets]
background_opacity = 0.73999998345971107
center = [ "clock", "spacer_2", "media", "spacer_3", "notifications" ]
end = [ "network", "bluetooth", "volume", "battery", "brightness", "tray", "control-center" ]
font_family = "Adwaita Sans"
margin_edge = 4
margin_ends = 350
padding = 10
radius = 80
scale = 1.1000000089406967
start = [ "workspaces", "taskbar" ]
thickness = 32
widget_spacing = 8

[brightness]
enable_ddcutil = true

[control_center]
width = 750

[desktop_widgets]
schema_version = 1
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1596.0
    cy = 608.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        rotation_speed = 0.40000000000000002
        visualization_mode = "wave_rings"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 160.0
    box_width = 384.0
    cx = 1600.0
    cy = 892.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        color = "on_surface"
        hide_when_no_media = false
        layout = "horizontal"
        shadow = true

[dock]
auto_hide = true

[idle]
pre_action_fade_seconds = 5

[location]
auto_locate = true

[lockscreen]
allow_empty_password = true
blur_intensity = 0.39999999105930328

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-3", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 400.0
    box_width = 432.0
    cx = 1280.0
    cy = 720.0
    output = "DP-3"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "analog"

[nightlight]
enabled = true

[notification]
position = "top_center"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
app_icon_color = "on_surface"
font_family = "Adwaita Sans"
screen_time_enabled = true
telemetry_enabled = false
ui_scale = 1.2000000104308128

    [shell.panel]
    launcher_categories = false
    launcher_placement = "attached"
    session_placement = "centered"

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper.default]
path = "/home/jzep/Pictures/Wallpapers/wallhaven_lyz3d2.jpg"

[wallpaper.last]
path = "/home/jzep/Pictures/Wallpapers/wallhaven_lyz3d2.jpg"

[wallpaper.monitors.DP-3]
path = "/home/jzep/Pictures/Wallpapers/wallhaven_lyz3d2.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/jzep/Pictures/Wallpapers/wallhaven_lyz3d2.jpg"

[widget.brightness]
show_label = false

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.spacer_2]
length = 10
type = "spacer"

[widget.spacer_3]
length = 10
type = "spacer"

[widget.taskbar]
only_active_workspace = true

[widget.tray]
drawer = true
hidden = [ "udiskie" ]
match_adjacent_spacing = true
pinned = [ "spotify" ]

[widget.volume]
show_label = false

[widget.workspaces]
hide_when_empty = true
