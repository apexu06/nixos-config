theme = "stylix"

[editor]
completion-timeout = 5
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.statusline]
left = ["mode", "spacer", "version-control", "file-absolute-path"]
right = ["diagnostics", "file-type", "primary-selection-length", "position", "file-encoding"]
separator = "│"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.lsp]
display-progress-messages = true

[keys.normal.space]
R = ":config-reload"
"`" = ":buffer-previous"
o = ":oil"

[keys.normal]
H = ":buffer-previous"
L = ":buffer-next"

[keys.normal.space.o]
e = ":oil-enter"
b = ":oil-back"
g = ":oil-root"
s = ":oil-save"
r = ":oil-refresh"
q = ":oil-close"
h = ":oil-toggle-hidden"
i = ":oil-toggle-git-ignored"

